name: uts_katalog
description: "BacaKita - aplikasi katalog buku (UTS Mobile Programming)."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers with dots, like 1.2.43
# followed by an optional build number with a +.
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# The following section is specific to Flutter.
flutter:
  # The following line ensures that the Material Icons font is
  # included in your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Data dummy disimpan sebagai file JSON lokal (Spesifikasi UTS II.b).
  # Strukturnya menyerupai respons API agar mudah diganti dengan HTTP request
  # pada tahap pengembangan berikutnya.
  assets:
    - assets/data/